version: '3.3'

services:
  ess-mocks:
    image: dci-ess-mocks
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3333:3003" # ESS endpoints (search, sync/search, check-enrollment, subscribe, txn/status, notify, ...)
      - "3334:3004" # SP-MIS callback endpoints (on-search, notify, ...)
    extra_hosts:
      # lets the mock call back the test runner's listener (header.sender_uri)
      - "host.docker.internal:host-gateway"
    networks:
      - web

networks:
  web:
    driver: bridge
